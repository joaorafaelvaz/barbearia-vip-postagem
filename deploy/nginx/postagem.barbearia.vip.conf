# /etc/nginx/sites-available/postagem.barbearia.vip
# Proxy reverso para o app (Docker, 127.0.0.1:3022). O certbot preenche o bloco 443.

upstream postagem_app {
    server 127.0.0.1:3022;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name postagem.barbearia.vip;

    # Desafio do Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name postagem.barbearia.vip;

    ssl_certificate     /etc/letsencrypt/live/postagem.barbearia.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postagem.barbearia.vip/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Uploads de vídeo até 300MB
    client_max_body_size 320m;
    client_body_timeout 300s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Mídias enviadas (volume ./data/uploads do compose). Precisam ser públicas: Meta e Google baixam daqui.
    location /uploads/ {
        alias /opt/postagem/data/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Assets gerados pelo Next (imutáveis)
    location /_next/static/ {
        proxy_pass http://postagem_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://postagem_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
}
